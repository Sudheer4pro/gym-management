      (function () {
        try {
          if (typeof window !== 'undefined' && 'fetch' in window) {
            var originalFetch = window.fetch;
            var activeFetch = function () {
              return originalFetch.apply(window, arguments);
            };
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return activeFetch;
              },
              set: function (newFetch) {
                activeFetch = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (desc && !desc.set && desc.configurable) {
                var protoFetch = desc.get;
                var currentFetch = window.fetch;
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function () {
                    return currentFetch || (protoFetch && protoFetch.call(this));
                  },
                  set: function (val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            }
          } catch (err) {}
        }
      })();
    </script>
